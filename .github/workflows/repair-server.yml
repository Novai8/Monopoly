name: Repair server auction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authoritative server
        run: python3 scripts/repair-server.py
      - name: Commit repaired server
        run: |
          if git diff --quiet -- server.ts; then
            echo "Server already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "[server-repair] Enforce authoritative auction turns"
          git push
