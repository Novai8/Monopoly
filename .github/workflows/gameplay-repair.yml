name: Gameplay Repair
on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply gameplay fixes
        run: python3 scripts/apply-gameplay-fixes.py
      - name: Verify source patterns
        run: |
          test -f src/engine/gameEngine.ts
          grep -q "resolveMovementLanding" src/engine/gameEngine.ts
          grep -q "scheduleBotTurn" server.ts
          grep -q "case 'ADD_BOT'" server.ts
          grep -q "movementTarget" src/types.ts
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Server typecheck
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts
      - name: Build
        run: npm run build
      - name: Remove temporary repair tooling
        run: |
          rm -f .github/workflows/gameplay-repair.yml scripts/apply-gameplay-fixes.py
      - name: Commit verified gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/engine/gameEngine.ts src/types.ts .github/workflows/gameplay-repair.yml scripts/apply-gameplay-fixes.py
          git commit -m "fix: complete multiplayer bots and card movement" || exit 0
          git push origin HEAD:main
