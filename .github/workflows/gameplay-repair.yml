name: Gameplay Repair
on:
  push:
    branches: [main]

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: complete multiplayer bots and card movement') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply gameplay fixes
        run: python3 scripts/apply-gameplay-fixes.py
      - name: Verify source patterns
        run: |
          grep -q "runServerBotAction" server.ts
          grep -q "scheduleBotTurn" server.ts
          grep -q "case 'ADD_BOT'" server.ts
          grep -q "movementTarget" src/engine/gameEngine.ts
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Server typecheck
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts
      - name: Build
        run: npm run build
      - name: Gameplay unit checks
        run: |
          node --import tsx --input-type=module <<'EOF'
          import { GameEngine } from './src/engine/gameEngine.ts';
          import { generateClassicBoard } from './src/data/classicBoard.ts';
          import { initializeOwnership } from './src/utils/gameHelpers.ts';
          const tiles = generateClassicBoard('standard', 'classic-town');
          const player = { id: 'p1', name: 'Test', isAI: false, isBot: false, color: '#000', character: 'duck', balance: 1500, position: 7, inDetention: false, detentionTurns: 0, detentionPasses: 0, bankrupt: false, voiceState: 'quiet' };
          const players = [player, { ...player, id: 'p2', name: 'Other', position: 0 }];
          const ownership = initializeOwnership(tiles);
          const move = GameEngine.executeCard({ id: 'move-test', deck: 'event', title: 'Move', description: 'Move', category: 'good', rarity: 'common', actionType: 'move-spaces', value: 3 }, player, players, tiles, ownership, tiles.length);
          if (move.movementTarget !== 10 || move.updatedPlayer.position !== 10) throw new Error('Card movement did not expose its target position');
          const landing = GameEngine.resolveLanding(move.updatedPlayer, tiles[10], tiles, move.updatedOwnership, move.updatedAllPlayers, { mode: 'classic', gameMode: 'classic', boardSize: 'standard', boardName: 'Classic Town', theme: 'classic-town', boardTheme: 'classic-town', difficulty: 'normal', botDifficulty: 'normal', playerLimit: 4, startingMoney: 1500, turnTimer: 45, auctionsEnabled: true, tradingEnabled: true, voiceEnabled: true, reducedMotion: false, cameraMode: 'top-down', soundVolume: 80, sfxVolume: 80, voiceVolume: 80, sfxEnabled: true }, 0);
          if (landing.type !== 'property' && landing.type !== 'unowned') throw new Error('Movement target did not re-enter landing resolution');
          console.log('Gameplay unit checks passed');
          EOF
      - name: Remove temporary repair tooling
        run: |
          rm -f .github/workflows/gameplay-repair.yml scripts/apply-gameplay-fixes.py
      - name: Commit verified gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/App.tsx src/engine/gameEngine.ts .github/workflows/gameplay-repair.yml scripts/apply-gameplay-fixes.py
          git commit -m "fix: complete multiplayer bots and card movement"
          git push origin HEAD:main
