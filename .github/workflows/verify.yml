name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Server type check
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts
      - name: Production build
        run: npm run build
      - name: Remove generated staging artifacts
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'gameplay-bot-card-staging' && !contains(github.event.head_commit.message, 'remove generated staging artifacts') }}
        run: |
          git fetch origin main --depth=1
          git rm -r --cached --ignore-unmatch node_modules dist
          rm -rf node_modules dist
          git checkout origin/main -- .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated staging artifacts"
          git push origin HEAD:gameplay-bot-card-staging
