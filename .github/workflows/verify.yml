name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted gameplay and UI fixes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.ts'); s=p.read_text()
          s=s.replace("import { shouldAIBuyProperty } from './src/utils/aiLogic';", "import { shouldAIBuyProperty, shouldAIBidOnAuction, findAIPropertiesToBuild, evaluateAITrade } from './src/utils/aiLogic';")
          s=s.replace("const botActionLocks = new Set<string>();", "const botActionLocks = new Map<string, number>();")
          s=s.replace("""  if (gs.gamePhase === 'opening-roll') {\n    const bot = gs.players.find((player) => player.isBot && !player.bankrupt);\n    return bot ? { botId: bot.id, action: { type: 'OPENING_ROLL_ACTION' } } : null;\n  }""", """  if (gs.gamePhase === 'opening-roll' && gs.openingRoll) {\n    const candidates = gs.openingRoll.tiedPlayerIds.length ? gs.openingRoll.tiedPlayerIds : gs.players.filter((player) => !gs.openingRoll?.rolls[player.id]).map((player) => player.id);\n    const botId = candidates.find((id) => gs.players.find((player) => player.id === id)?.isBot && !gs.players.find((player) => player.id === id)?.bankrupt);\n    return botId ? { botId, action: { type: 'OPENING_ROLL_ACTION' } } : null;\n  }""")
          s=s.replace("""    const decision = shouldAIBuyProperty(bot, tile, tiles, gs.ownership);\n    const nextBid = gs.auction.currentBid + 10;\n    return decision.shouldBid && nextBid <= decision.maxBid ? { botId: bot.id, action: { type: 'PLACE_BID', amount: nextBid } } : { botId: bot.id, action: { type: 'PASS_AUCTION' } };""", """    const decision = shouldAIBidOnAuction(bot, tile, gs.auction.currentBid, tiles, gs.ownership, gs.players);\n    const nextBid = gs.auction.currentBid + 10;\n    return decision.shouldBid && nextBid <= decision.maxBid ? { botId: bot.id, action: { type: 'PLACE_BID', amount: nextBid } } : { botId: bot.id, action: { type: 'PASS_AUCTION' } };""")
          s=s.replace("""  const bot = gs.players[gs.activePlayerIndex];\n  if (!bot?.isBot || bot.bankrupt) return null;""", """  const trade = gs.activeTrades.find((candidate) => candidate.status === 'pending' && gs.players.find((player) => player.id === candidate.toPlayerId)?.isBot);\n  if (trade) {\n    const bot = gs.players.find((player) => player.id === trade.toPlayerId);\n    if (bot && !bot.bankrupt) {\n      const tiles = roomBoardTiles.get(room.code) || [];\n      const evaluation = evaluateAITrade(trade, bot, tiles, gs.ownership);\n      return { botId: bot.id, action: { type: evaluation.accept ? 'ACCEPT_TRADE' : 'DECLINE_TRADE', tradeId: trade.id } };\n    }\n  }\n  const bot = gs.players[gs.activePlayerIndex];\n  if (!bot?.isBot || bot.bankrupt) return null;""")
          s=s.replace("case 'ready-to-roll': { const buildId = findAIPropertiesToBuild(bot, tiles, gs.ownership); return buildId !== null ? { botId: bot.id, action: { type: 'UPGRADE_PROPERTY', tileId: buildId } } : { botId: bot.id, action: { type: 'ROLL_DICE' } }; }", "case 'ready-to-roll': { const tiles = roomBoardTiles.get(room.code) || []; const buildId = findAIPropertiesToBuild(bot, tiles, gs.ownership); return buildId !== null ? { botId: bot.id, action: { type: 'UPGRADE_PROPERTY', tileId: buildId } } : { botId: bot.id, action: { type: 'ROLL_DICE' } }; }")
          s=s.replace("""    const auctionTurnId = room.gameState?.auction?.turnId ?? 0;\n    const lockKey = `${room.code}:${decision.botId}:${room.gameState?.gamePhase}:${auctionTurnId}:${room.gameState?.activePlayerIndex}`;\n    if (botActionLocks.has(lockKey)) return;\n    botActionLocks.set(lockKey, Date.now());""", """    const auctionTurnId = room.gameState?.auction?.turnId ?? 0;\n    const lockKey = `${room.code}:${decision.botId}:${room.gameState?.gamePhase}:${auctionTurnId}:${room.gameState?.activePlayerIndex}`;\n    if (botActionLocks.has(lockKey)) return;\n    botActionLocks.set(lockKey, Date.now());""")
          s=s.replace("""      const currentBot = currentRoom.gameState.players.find((player) => player.id === decision.botId);\n      if (!currentBot?.isBot || currentBot.bankrupt) return;\n      handleClientAction(null, decision.action, decision.botId);""", """      const currentBot = currentRoom.gameState.players.find((player) => player.id === decision.botId);\n      if (!currentBot?.isBot || currentBot.bankrupt) return;\n      const currentAuction = currentRoom.gameState.auction;\n      if (decision.action.type === 'PLACE_BID' || decision.action.type === 'PASS_AUCTION') {\n        if (currentRoom.gameState.gamePhase !== 'auction' || !currentAuction?.active || currentAuction.currentBidderId !== decision.botId) return;\n      }\n      handleClientAction(null, decision.action, decision.botId);""")
          s=s.replace("""  auction.currentBidderIndex = nextIndex;\n  auction.currentBidderId = auction.bidders[nextIndex];\n  auction.turnId = (auction.turnId ?? 0) + 1;""", """  auction.currentBidderIndex = nextIndex;\n  auction.currentBidderId = auction.bidders[nextIndex];\n  auction.turnId = (auction.turnId ?? 0) + 1;""")
          s=s.replace("""    auction.active = false; gs.auction = null; gs.gamePhase = 'turn-end';\n    broadcastToRoom(room.code, { type: 'STATE_UPDATE', gameState: gs }); return;""", """    auction.active = false; gs.auction = null; gs.gamePhase = 'turn-end';\n    for (const key of botActionLocks.keys()) if (key.startsWith(`${room.code}:`)) botActionLocks.delete(key);\n    broadcastToRoom(room.code, { type: 'STATE_UPDATE', gameState: gs }); return;""")
          s=s.replace("""if (nextIndex === null) { auction.active = false; gs.auction = null; gs.gamePhase = 'turn-end'; broadcastToRoom(room.code, { type: 'STATE_UPDATE', gameState: gs }); return; }""", """if (nextIndex === null) { auction.active = false; gs.auction = null; gs.gamePhase = 'turn-end'; for (const key of botActionLocks.keys()) if (key.startsWith(`${room.code}:`)) botActionLocks.delete(key); broadcastToRoom(room.code, { type: 'STATE_UPDATE', gameState: gs }); return; }""")
          s=s.replace("""const personalities = ['conservative', 'aggressive', 'collector', 'investor', 'opportunist', 'balanced'] as const;\n      const bot: Player = {""", """const personalities = ['conservative', 'aggressive', 'collector', 'investor', 'opportunist', 'balanced'] as const;\n      const bot: Player = {""")
          p.write_text(s)
          p=Path('src/App.tsx'); s=p.read_text(); s=s.replace("  shouldAIBuyProperty,\n} from './utils/aiLogic';", "  shouldAIBuyProperty,\n  shouldAIBidOnAuction,\n} from './utils/aiLogic';")
          old="""      const shouldBid = shouldAIBuyProperty(bidder, boardTiles[auction.tileId], boardTiles, ownership);\n      const amount = auction.currentBid + 10;\n      if (shouldBid && bidder.balance >= amount) {\n        const bidderIndex = auction.bidders.indexOf(bidder.id);\n        const next = nextEligibleAuctionIndex({ ...auction, highestBidderId: bidder.id, currentBid: amount }, players, bidderIndex);\n        setAuction({ ...auction, currentBid: amount, highestBidderId: bidder.id, currentBidderId: next === null ? null : auction.bidders[next], currentBidderIndex: next ?? bidderIndex, timeLeft: 15, history: [...auction.history, { playerId: bidder.id, amount, time: new Date().toISOString() }] });\n      } else passAuction();"""
          new="""      const tile = boardTiles[auction.tileId];\n      if (!tile) return;\n      const decision = shouldAIBidOnAuction(bidder, tile, auction.currentBid, boardTiles, ownership, players);\n      const amount = auction.currentBid + 10;\n      if (decision.shouldBid && amount <= decision.maxBid && bidder.balance >= amount) {\n        const bidderIndex = auction.bidders.indexOf(bidder.id);\n        const next = nextEligibleAuctionIndex({ ...auction, highestBidderId: bidder.id, currentBid: amount }, players, bidderIndex);\n        setAuction({ ...auction, currentBid: amount, highestBidderId: bidder.id, currentBidderId: next === null ? null : auction.bidders[next], currentBidderIndex: next ?? bidderIndex, timeLeft: 15, history: [...auction.history, { playerId: bidder.id, amount, time: new Date().toISOString() }] });\n      } else {\n        const passed = auction.passedPlayerIds.includes(bidder.id) ? auction.passedPlayerIds : [...auction.passedPlayerIds, bidder.id];\n        const remaining = auction.bidders.filter((id) => !passed.includes(id) && !players.find((player) => player.id === id)?.bankrupt);\n        if (remaining.length === 1 && auction.highestBidderId === remaining[0]) completeAuction({ ...auction, passedPlayerIds: passed });\n        else {\n          const next = nextEligibleAuctionIndex({ ...auction, passedPlayerIds: passed }, players, auction.bidders.indexOf(bidder.id));\n          if (next === null) completeAuction({ ...auction, passedPlayerIds: passed });\n          else setAuction({ ...auction, passedPlayerIds: passed, currentBidderId: auction.bidders[next], currentBidderIndex: next, timeLeft: 15 });\n        }\n      }"""
          assert old in s; s=s.replace(old,new); p.write_text(s)
          p=Path('src/components/MainMenu.tsx'); s=p.read_text().replace('TOWN TYCOON <span className="text-amber-400">3D</span>', 'TOWN TYCOON').replace('physical miniature tabletop world with Single Player and Online Multiplayer.', 'colorful tabletop board with Single Player and Online Multiplayer.'); p.write_text(s)
          p=Path('src/components/MultiplayerLobbyModal.tsx'); s=p.read_text(); s=s.replace("  ShieldCheck,\n  Radio,", "  ShieldCheck,\n  Radio,\n  Bot,\n  UserRound,"); s=s.replace("{charDef?.name || 'Pawn'}</span>", "{charDef?.name || 'Pawn'} {p.isBot ? `• ${p.difficulty || 'normal'} bot` : '• human'}</span>"); s=s.replace("{p.isHost && (", "{p.isBot ? <span className=\"flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-300 text-[10px] font-bold\"><Bot className=\"w-3 h-3\" /> BOT</span> : <span className=\"flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-stone-800 text-stone-300 text-[10px] font-bold\"><UserRound className=\"w-3 h-3\" /> HUMAN</span>}\n                            {p.isHost && ("); marker="            {/* Player Controls: Ready Up & Character Swap */}"; insert="""            {isHost && room.players.length < room.playerLimit && (\n              <div className=\"p-3.5 rounded-xl bg-blue-500/5 border border-blue-500/20 space-y-2\">\n                <div className=\"flex items-center justify-between\"><span className=\"text-xs font-bold text-stone-200\">Add computer player</span><span className=\"text-[10px] text-stone-500\">{room.playerLimit - room.players.length} slots left</span></div>\n                <div className=\"grid grid-cols-4 gap-2\">\n                  {(['easy','normal','hard','expert'] as BotDifficulty[]).map((difficulty) => <button key={difficulty} type=\"button\" onClick={() => onAddBot(difficulty)} className=\"py-2 rounded-xl bg-stone-900 border border-stone-700 hover:border-blue-400 text-stone-200 text-[10px] font-black uppercase transition-colors\">+ {difficulty}</button>)}\n                </div>\n              </div>\n            )}\n\n"""; assert marker in s; s=s.replace(marker,insert+marker); p.write_text(s)
          p=Path('src/components/AuctionModal.tsx'); s=p.read_text(); s=s.replace("<span>Your Available Cash: <strong className=\"text-emerald-400 font-mono\">${me.balance}</strong></span>", "<div className=\"flex flex-wrap gap-x-4 gap-y-1\"><span>Your Cash: <strong className=\"text-emerald-400 font-mono\">${me.balance}</strong></span><span>Safe Bid Ceiling: <strong className=\"text-amber-300 font-mono\">${Math.max(0, me.balance - (me.difficulty === 'expert' ? 300 : me.difficulty === 'hard' ? 220 : me.difficulty === 'normal' ? 140 : 80))}</strong></span></div>"); p.write_text(s)
          PY
      - name: Commit applied source changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts src/App.tsx src/components/MainMenu.tsx src/components/AuctionModal.tsx src/components/MultiplayerLobbyModal.tsx
          git commit -m "fix: tighten auction and bot state handling"
          git push --force origin HEAD:${{ github.head_ref }}
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Server type check
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts
      - name: Production build
        run: npm run build
