name: Gameplay staging
on:
  push:
    branches: [gameplay-bot-card-staging]

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply gameplay patch
        run: python3 scripts/patch-gameplay-v2.py
      - name: Source safety checks
        run: |
          ! grep -R "ThreeBoard\|from ['\"]three['\"]\|@ts-ignore\|@ts-nocheck" -n src server.ts || true
          grep -q "case 'ADD_BOT'" server.ts
          grep -q "scheduleBotActions" server.ts
          grep -q "handleClientAction(null, decision.action, decision.botId)" server.ts
          grep -q "cardRes.targetPosition !== undefined" server.ts
          grep -q "resolveLandingOutcome(room, player.id, 0, false)" server.ts
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Server type check
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts
      - name: Build
        run: npm run build
      - name: Engine card movement tests
        run: |
          node --import tsx --input-type=module <<'EOF'
          import { GameEngine } from './src/engine/gameEngine.ts';
          import { generateClassicBoard } from './src/data/classicBoard.ts';
          import { initializeOwnership } from './src/utils/gameHelpers.ts';
          const tiles = generateClassicBoard('standard', 'classic-town');
          const base = { id:'p1', name:'Tester', isAI:false, isBot:false, color:'#000', character:'duck', balance:1500, position:0, inDetention:false, detentionTurns:0, detentionPasses:0, bankrupt:false, voiceState:'quiet' };
          const other = { ...base, id:'p2', name:'Owner', position:0 };
          const players = [base, other];
          const ownership = initializeOwnership(tiles);
          const move = GameEngine.executeCard({ id:'move', deck:'event', title:'Move', description:'Move', category:'good', rarity:'common', actionType:'move-spaces', value:3 }, base, players, tiles, ownership, tiles.length);
          if (move.targetPosition !== 3 || move.updatedPlayer.position !== 3) throw new Error('move-spaces target failed');
          const propertyLanding = GameEngine.resolveLanding(move.updatedPlayer, tiles[3], tiles, move.updatedOwnership, move.updatedAllPlayers, { mode:'classic', gameMode:'classic', boardSize:'standard', boardName:'Classic Town', theme:'classic-town', boardTheme:'classic-town', difficulty:'normal', botDifficulty:'normal', playerLimit:4, startingMoney:1500, turnTimer:45, auctionsEnabled:true, tradingEnabled:true, voiceEnabled:true, reducedMotion:false, cameraMode:'top-down', soundVolume:80, sfxVolume:80, voiceVolume:80, sfxEnabled:true }, 0);
          if (!['unowned','safe','rent'].includes(propertyLanding.type)) throw new Error('property landing failed');
          const jailMove = GameEngine.executeCard({ id:'jail', deck:'event', title:'Jail', description:'Jail', category:'bad', rarity:'common', actionType:'go-detention' }, base, players, tiles, ownership, tiles.length);
          if (!jailMove.updatedPlayer.inDetention) throw new Error('go-detention failed');
          console.log('Engine card movement tests passed');
          EOF
      - name: Multiplayer bot integration test
        run: |
          cat > /tmp/test-multiplayer.mjs <<'EOF'
          import { spawn } from 'node:child_process';
          import WebSocket from 'ws';
          const server = spawn('node', ['--import', 'tsx', 'server.ts'], { env: { ...process.env, NODE_ENV: 'production' }, stdio: ['ignore','pipe','pipe'] });
          await new Promise((resolve, reject) => { const timer=setTimeout(()=>reject(new Error('server start timeout')),8000); server.stdout.on('data',d=>{ if(String(d).includes('Town Tycoon Server listening')){clearTimeout(timer);resolve();}}); server.stderr.on('data',d=>process.stderr.write(d)); });
          const ws = new WebSocket('ws://127.0.0.1:3000');
          const messages=[];
          await new Promise((resolve,reject)=>{ const timer=setTimeout(()=>reject(new Error('ws open timeout')),5000); ws.on('open',()=>{clearTimeout(timer);resolve();}); ws.on('error',reject); });
          const waitFor = (predicate, timeout=15000) => new Promise((resolve,reject)=>{ const timer=setTimeout(()=>reject(new Error('timed out waiting for state')),timeout); const check=()=>{ const m=messages.find(predicate); if(m){clearTimeout(timer);resolve(m);} }; const id=setInterval(check,50); check(); });
          ws.on('message',raw=>{ try{messages.push(JSON.parse(String(raw)));}catch{} });
          const send = action => ws.send(JSON.stringify(action));
          send({type:'CREATE_ROOM',playerName:'Tester',character:'duck'});
          const created = await waitFor(m=>m.type==='ROOM_CREATED',5000);
          send({type:'ADD_BOT',difficulty:'normal'});
          const lobby = await waitFor(m=>m.type==='ROOM_UPDATED' && m.room.players.some(p=>p.isBot),5000);
          const bot = lobby.room.players.find(p=>p.isBot);
          if(!bot || !bot.ready || !bot.isBot) throw new Error('server bot was not created as a real player');
          send({type:'SET_READY',ready:true});
          send({type:'START_GAME'});
          await waitFor(m=>m.type==='GAME_STARTED',5000);
          const states=[]; const originalCount=messages.length;
          let sawBotTurn=false, sawBotProgress=false;
          const end=Date.now()+25000;
          while(Date.now()<end){
            for(const m of messages.slice(originalCount)){ if(m.type!=='STATE_UPDATE') continue; states.push(m.gameState); const bp=m.gameState.players.find(p=>p.id===bot.id); if(m.gameState.activePlayerIndex>=0 && m.gameState.players[m.gameState.activePlayerIndex]?.id===bot.id) sawBotTurn=true; if(bp && (bp.position!==0 || bp.balance!==1500 || bp.bankrupt)) sawBotProgress=true; }
            if(sawBotTurn && sawBotProgress) break;
            await new Promise(r=>setTimeout(r,250));
          }
          if(!sawBotTurn || !sawBotProgress) throw new Error('bot scheduler did not execute a real authoritative turn');
          ws.close(); server.kill('SIGTERM');
          console.log('Multiplayer bot integration test passed');
          EOF
          node /tmp/test-multiplayer.mjs
      - name: Cleanup temporary tooling and commit verified gameplay
        run: |
          rm -f scripts/patch-gameplay.py scripts/patch-gameplay-v2.py .github/workflows/gameplay-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add server multiplayer bots and chained card landings"
          git push origin HEAD:gameplay-bot-card-staging
