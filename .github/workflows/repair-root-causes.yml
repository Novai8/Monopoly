name: Repair root causes

on:
  push:
    branches: [fix/lobby-auction-root-causes]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply targeted repair
        run: node scripts/apply-root-cause-repair.mjs

      - name: Install dependencies after repair
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Server TypeScript check
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2020 server.ts

      - name: Build
        run: npm run build

      - name: Regression tests
        run: npx tsx scripts/root-cause-regression.ts

      - name: Remove staging helpers
        run: rm -f scripts/apply-root-cause-repair.mjs scripts/root-cause-regression.ts .github/workflows/repair-root-causes.yml

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/types.ts src/utils/aiLogic.ts src/utils/multiplayerClient.ts src/App.tsx scripts .github/workflows/repair-root-causes.yml package-lock.json
          git diff --cached --quiet && { echo "No source changes detected"; exit 1; }
          git commit -m "fix: repair multiplayer lobby and bounded bot auctions"
          git push origin HEAD:fix/lobby-auction-root-causes
